spring.application.name=boot2-tutorial-app
server.port=8080

demo.greeting.prefix=Hello
app.jwt.secret=01234567890123456789012345678901

tutorial.name=Spring Boot 2 Tutorial
tutorial.description=Runnable examples for every chapter
tutorial.contact.email=team@example.com

spring.datasource.url=jdbc:h2:mem:tutorial;MODE=MYSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.cache.type=simple
spring.task.execution.pool.core-size=2
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=false

management.endpoints.web.exposure.include=health,info,caches
management.endpoint.health.show-details=always
logging.level.com.example.tutorial=INFO
